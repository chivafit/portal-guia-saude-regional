name: Validar o Guia Saúde

# GitHub Actions desativado por enquanto (sem plano pago): roda só manualmente, pela aba Actions.
# O site é validado e publicado pela Vercel (build:pages); ver docs/sem-github-actions.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Lint, dados, SEO, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar gate de release
        # Simula o deploy da Vercel (inclui /aplicativo/ e /anuncie/ de site-publico).
        run: APPLY_PUBLIC_SITE=1 npm run validate:release
