name: Publicar portal no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portal-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar build estatico
        run: npm run build:pages

      - name: Preservar dominio personalizado
        run: echo 'guiasaude.app.br' > out/CNAME

      - name: Desabilitar processamento Jekyll
        run: touch out/.nojekyll

      - name: Publicar gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
