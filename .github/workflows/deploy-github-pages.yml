name: Validar build do portal

on:
  # O site e publicado manualmente na branch gh-pages.
  # Este workflow fica disponivel somente para validacao sob demanda.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e validacoes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar e gerar o portal
        run: npm run build:pages
