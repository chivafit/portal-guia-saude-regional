<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convidados do Podcast | Guia Saúde</title><style>*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:#173042;font-family:Arial,Helvetica,sans-serif}.top{background:#063b62;color:#fff;padding:18px 0}.shell{width:min(1120px,calc(100% - 32px));margin:auto}.top a{color:#fff;text-decoration:none}.head{padding:44px 0 24px}.head h1{margin:0;color:#063b62;font:400 clamp(36px,6vw,58px)/1 Georgia}.head p{color:#617786;max-width:680px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:70px}.card{position:relative;display:block;text-decoration:none;color:inherit;background:linear-gradient(135deg,#f1e3c4,#fff 62%);border:2px solid #c58f2d;border-radius:20px;padding:18px;box-shadow:0 12px 34px rgba(104,72,18,.12)}.badge{display:inline-flex;background:#704d12;color:#fff;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800;margin-bottom:12px}.card img{width:100%;height:180px;object-fit:cover;border-radius:14px;background:#eee}.card h2{margin:15px 0 5px;color:#063b62;font:400 25px Georgia}.card p{margin:0;color:#617786;font-size:13px}.foot{padding:24px 0 50px}.foot a{color:#063b62;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="shell"><a href="/">Guia Saúde</a></div></header><main class="shell"><section class="head"><h1>Convidados do Podcast</h1><p>Profissionais que participaram do Conexão Saúde recebem destaque editorial especial no Guia Saúde.</p></section><section class="grid" id="grid"></section><div class="foot"><a href="/buscar/?cidade=Piumhi">← Ver todos os profissionais</a></div></main><script>const P=[['gabriela-araujo-fisioterapia-pelvica-piumhi','Gabriela Araújo','Fisioterapia Pélvica','/podcast/gabriela-araujo-fisioterapia-pelvica-horizontal.png'],['patricia-terra-odontologia-piumhi','Patrícia Terra','Dentística e Harmonização Orofacial','/podcast/patricia-terra-estetica-regenerativa-horizontal.png'],['dra-simone-mota-bonisson-endocrinologia-piumhi','Dra. Simone Mota Bonisson','Endocrinologia e Metabologia','/podcast/simone-bonisson-endocrinologia-horizontal.png'],['rodrigo-soares-costa-radiologia-piumhi','Rodrigo Soares Costa','Radiologia Odontológica','/podcast/radiologia-odontologica.jpg'],['livia-pereira-implantodontia-piumhi','Lívia Pereira','Implantodontia e Reabilitação Oral','/podcast/implantodontia-livia-pereira.jpg'],['daniela-melo-farmacia-piumhi','Daniela Melo','Farmácia','/podcast/medicalizacao-da-vida-daniela-melo.jpg'],['cintia-bonisson-psicanalise-piumhi','Cintia Bonisson','Psicanálise','/podcast/vinculos-afetivos-cintia-bonisson.jpg']];document.getElementById('grid').innerHTML=P.map(([s,n,a,i])=>`<a class="card" href="/profissionais/${s}/"><span class="badge">★ Convidado do Podcast</span><img src="${i}" alt="${n}"><h2>${n}</h2><p>${a} · Piumhi/MG</p></a>`).join('')</script></body></html>
